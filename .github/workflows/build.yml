name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/SVNFileBox.csproj

      - name: Build
        run: dotnet build src/SVNFileBox.csproj -c Release -r win-x64 --self-contained false

      - name: Publish
        run: dotnet publish src/SVNFileBox.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ./publish

      - name: Create zip
        shell: pwsh
        run: |
          $src = "publish/bin/Release/net10.0-windows/win-x64/publish"
          if (Test-Path $src) {
            Compress-Archive -Path "$src/*" -DestinationPath SVNFileBox-win64.zip
            Write-Host "Used nested path: $src"
          } elseif (Test-Path "publish") {
            $files = Get-ChildItem -Path "publish" -Recurse -Include "*.exe"
            if ($files) {
              Write-Host "Found exe at: $($files[0].FullName)"
            }
            Compress-Archive -Path "publish/*" -DestinationPath SVNFileBox-win64.zip
            Write-Host "Used publish root path"
          } else {
            Write-Host "ERROR: No publish output found"
            Get-ChildItem -R -Depth 3 | Select-Object FullName | Select-Object -First 30
          }

      - name: Check zip size
        shell: pwsh
        run: |
          $size = (Get-Item SVNFileBox-win64.zip).Length
          Write-Host "Zip size: $size bytes ($([math]::Round($size/1MB, 2)) MB)"
          if ($size -lt 10MB) { Write-Host "WARNING: zip is smaller than 10MB, likely missing runtime" }

      - name: Install Inno Setup via winget
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Write-Host "Installing Inno Setup via winget..."
          $output = winget install JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements 2>&1
          Write-Host $output
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $timeout = 120
          $elapsed = 0
          while (-not (Test-Path $iscc) -and $elapsed -lt $timeout) {
            Start-Sleep -Seconds 5
            $elapsed += 5
            Write-Host "Waiting for ISCC... ${elapsed}s"
          }
          if (Test-Path $iscc) {
            Write-Host "Inno Setup installed successfully at: $iscc"
          } else {
            Write-Host "ERROR: Inno Setup installation timed out"
            Get-ChildItem "C:\Program Files (x86)" -Filter "Inno*" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

      - name: Build installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ERROR: ISCC.exe not found"
            exit 1
          }
          Write-Host "Running: $iscc installer.iss"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $iscc
          $psi.Arguments = "installer.iss"
          $psi.WorkingDirectory = (Get-Location).Path
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit()
          Write-Host "STDOUT: $stdout"
          Write-Host "STDERR: $stderr"
          Write-Host "Exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit 1 }
          if (Test-Path SVNFileBox-Setup.exe) {
            Write-Host "Installer built: $(Get-Item SVNFileBox-Setup.exe).Length bytes"
          } else {
            Write-Host "ERROR: SVNFileBox-Setup.exe not created"
            Get-ChildItem | Select-Object Name, Length
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVNFileBox-win64
          path: |
            SVNFileBox-win64.zip
            SVNFileBox-Setup.exe
          retention-days: 5

      - name: Create or Update Draft Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "v2.3.0"
          $notes = @"
          Windows SVN 同步客户端，基于 .NET 10 + WPF 构建。

          ## 下载
          - Windows 便携版: `SVNFileBox-win64.zip`（绿色版，解压即用，内置 .NET 10 运行时）
          - Windows 安装包: `SVNFileBox-Setup.exe`（安装向导，支持开始菜单/桌面快捷方式/卸载）

          ## 更新日志

          ### 新功能
          - **批量提交队列** — 本地优先的异步提交队列，减少 SVN 网络往返（PendingCommitQueue + QueueCommitProcessor）
          - **Toast 通知** — 所有用户操作结果均通过系统托盘气泡提示（复制、重命名、删除、新建文件夹、手动同步）
          - **SVN Move 支持** — 新增 SvnService.MoveAsync() 方法

          ### Bug 修复
          - 修复单例线程安全问题（Lazy<T>）
          - 修复批量失败后重新入队死循环 — 失败批次现在正确桥接到重试池
          - 修复 Move 操作中 FromPath 在 GetCommonParent 中被忽略
          - 修复 minBatchSize 导致计时器触发的提交被静默跳过
          - 修复 EnqueueFileChange 中 fire-and-forget 的 SVN 命令未正确 await
          - 修复 SyncNow 在队列 < minBatchSize 时行为不可预测
          - 修复删除/添加拓扑 — 嵌套操作按路径深度排序（先删深层，先加浅层）
          "@
          # Check if draft already exists
          $existing = gh release view $version --repo vxling/SVNFileBox --json id --jq .id 2>$null
          if ($existing) {
            gh release delete $version --repo vxling/SVNFileBox --yes
            Write-Host "Deleted existing draft release $version"
          }
          gh release create $version `
            ./SVNFileBox-win64.zip `
            ./SVNFileBox-Setup.exe `
            --draft `
            --repo vxling/SVNFileBox `
            --title "SVNFileBox $version" `
            --notes "$notes"
          Write-Host "Draft release $version ready"
