name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SVNFileBox.csproj

      - name: Build
        run: dotnet build src/SVNFileBox.csproj -c Release -r win-x64 --self-contained false

      - name: Publish
        run: dotnet publish src/SVNFileBox.csproj -c Release -r win-x64 -o ./publish

      - name: Create zip
        shell: pwsh
        run: |
          $src = "publish/bin/Release/net8.0-windows/win-x64/publish"
          if (Test-Path $src) {
            Compress-Archive -Path "$src/*" -DestinationPath SVNFileBox-win64.zip
          } else {
            # Try alternative path
            $alt = Get-ChildItem -Path "src/bin" -Recurse -Include "SVNFileBox.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($alt) { Compress-Archive -Path $alt.FullName -DestinationPath SVNFileBox-win64.zip }
            else { Write-Host "No publish output found"; Get-ChildItem -Path "src/bin" -Recurse -Directory | Select-Object -First 20 }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVNFileBox-win64
          path: SVNFileBox-win64.zip
          retention-days: 5
