name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SVNFileBox.csproj

      - name: Build
        run: dotnet build src/SVNFileBox.csproj -c Release -r win-x64 --self-contained false

      - name: Publish
        run: dotnet publish src/SVNFileBox.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ./publish

      - name: Create zip
        shell: pwsh
        run: |
          $src = "publish/bin/Release/net8.0-windows/win-x64/publish"
          if (Test-Path $src) {
            Compress-Archive -Path "$src/*" -DestinationPath SVNFileBox-win64.zip
            Write-Host "Used nested path: $src"
          } elseif (Test-Path "publish") {
            $files = Get-ChildItem -Path "publish" -Recurse -Include "*.exe"
            if ($files) {
              Write-Host "Found exe at: $($files[0].FullName)"
            }
            Compress-Archive -Path "publish/*" -DestinationPath SVNFileBox-win64.zip
            Write-Host "Used publish root path"
          } else {
            Write-Host "ERROR: No publish output found"
            Get-ChildItem -R -Depth 3 | Select-Object FullName | Select-Object -First 30
          }

      - name: Check zip size
        shell: pwsh
        run: |
          $size = (Get-Item SVNFileBox-win64.zip).Length
          Write-Host "Zip size: $size bytes ($([math]::Round($size/1MB, 2)) MB)"
          if ($size -lt 10MB) { Write-Host "WARNING: zip is smaller than 10MB, likely missing runtime" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVNFileBox-win64
          path: SVNFileBox-win64.zip
          retention-days: 5

      - name: Create Draft Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: SVNFileBox-win64.zip
          repo: vxling/SVNFileBox
          tag: v2.0.0
          name: SVNFileBox v2.0.0
          body: |
            Windows SVN 同步客户端，基于 .NET 8 + WPF + WPF-UI (Fluent Design) 构建。

            ## 下载
            - Windows: `SVNFileBox-win64.zip`（内置 .NET 8 运行时，无需单独安装）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}